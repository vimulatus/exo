services:
  postgres:
    image: postgres:17-alpine
    container_name: exo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: exo
      POSTGRES_PASSWORD: exo
      POSTGRES_DB: exo
    ports:
      # Host 5434 -> container 5432 (5432/5433 are taken by other projects).
      - "5434:5432"
    volumes:
      - exo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exo -d exo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  exo-pgdata:
